name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and assemble
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Action-Launcher-Enhanced-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Build signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_STORE_FILE: ${{ github.workspace }}/.signing/action-launcher-enhanced.p12
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_TYPE: PKCS12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Verify signature and prepare files
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Action-Launcher-Enhanced-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum "Action-Launcher-Enhanced-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Action-Launcher-Enhanced-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
